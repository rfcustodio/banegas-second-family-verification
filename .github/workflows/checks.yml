name: checks

# Runs the verification of every statement of the paper on each push and pull request.
on:
  push:
  pull_request:

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all quick checks
        run: ./run_quick_checks.sh
      - name: Independent suite (Algorithm 1)
        run: python3 independent/second_family.py

  full-verification:
    # Complete verification up to m = 1100, as reported in the paper (about 15 minutes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-sat
        run: pip install python-sat
      - name: Run verification/run_all.sh and compare with expected_output.txt
        run: make verify-all

  sat-certificates:
    # Regenerates the 12 DRAT proofs of the SAT optimality claims (Tables 2 and 5)
    # with CaDiCaL at the recorded commit and checks them with drat-trim (about 5 minutes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the tools, regenerate and check the certificates
        run: make sat-proofs
