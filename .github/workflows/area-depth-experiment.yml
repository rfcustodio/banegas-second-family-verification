name: Experimental area-depth comparison (m <= 1100)

on:
  push:
    branches:
      - experiment/area-depth-comparison-1100
    paths:
      - 'experiments/**'
      - '.github/workflows/area-depth-experiment.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - '.github/workflows/area-depth-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Compute XOR counts and circuit depths
        run: python experiments/area_depth_1100.py
      - name: Upload reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area-depth-1100
          path: experiments/results/
          if-no-files-found: warn
          retention-days: 30
