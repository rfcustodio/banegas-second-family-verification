name: Experimental area-depth comparison (m <= 1100)

on:
  push:
    branches:
      - experiment/area-depth-comparison-1100
    paths:
      - 'experiments/**'
      - '.github/workflows/area-depth-experiment.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - '.github/workflows/area-depth-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Compute XOR counts and circuit depths
        run: python experiments/area_depth_1100.py
      - name: Enumerate all F2 circuits and Pareto frontiers
        run: python experiments/pareto_f2_1100.py
      - name: Validate Pareto summary and render degree-228 example
        run: python experiments/analyze_pareto.py
      - name: Verify heuristic strip circuits for irreducible special members
        run: python experiments/special_strip_depth.py
      - name: Compare heuristic strip SLPs with existing Pareto frontiers
        run: python experiments/compare_special_frontiers.py
      - name: Compare full first- and second-family area formulas
        run: python experiments/family_formula_comparison.py
      - name: Verify selected first-family Conta-XOR baseline circuits
        run: python experiments/f1_contaxor_baseline.py
      - name: Compare measured cross-family Pareto frontiers on selected degrees
        run: python experiments/cross_family_measured_pareto.py
      - name: Cross-check consolidated experimental statistics
        run: python experiments/consolidated_checks.py
      - name: Upload reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area-depth-1100
          path: experiments/results/
          if-no-files-found: warn
          retention-days: 30
